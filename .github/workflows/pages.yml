name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "data/public/**", "data/demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: "Build (público - painel B2B só com dados FICTÍCIOS)"
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Garantir que nenhum dado privado foi publicado
        run: |
          grep -q '"data_kind": "DEMO"' web/dist/data/b2b.json
          test ! -e web/dist/data/search_snippets.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
